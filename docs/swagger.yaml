        type: string
    type: object
info:
  contact: {}
paths:
  /notes:
    get:
      description: Get a list of all notes
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/models.Note'
            type: array
      summary: List all notes
      tags:
      - notes
    post:
      consumes:
      - application/json
      description: Create a new note with a title and content
      parameters:
      - description: Note to create
        in: body
        name: note
        required: true
        schema:
          $ref: '#/definitions/models.Note'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/models.Note'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Create a new note
      tags:
      - notes
  /notes/{id}:
    delete:
      description: Delete a note by its ID
      parameters:
      - description: Note ID
        in: path
        name: id
        required: true
        type: integer
      responses:
        "204":
          description: No Content
          schema:
            type: string
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties:
